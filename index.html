// HOOKS
// ═══════════════════════════════════════════════
function useReveal(threshold = 0.15) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); o.unobserve(el); } }, { threshold });
    o.observe(el);
    return () => o.disconnect();
  }, []);
  return [ref, v];
}

// ═══════════════════════════════════════════════
// BITS-TO-SIGNAL CANVAS ANIMATION
// ═══════════════════════════════════════════════
function BitFieldCanvas() {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const particlesRef = useRef([]);
  const mouseRef = useRef({ x: 0, y: 0 });

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let W, H, funnelX, funnelY;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      funnelX = W * 0.52;
      funnelY = H * 0.5;
    }
    resize();
    window.addEventListener("resize", resize);

    const handleMouse = (e) => { mouseRef.current = { x: e.clientX, y: e.clientY }; };
    window.addEventListener("mousemove", handleMouse, { passive: true });

    // Particle pool
    const TOTAL = 220;
    const particles = [];

    function createParticle() {
      // Random position on left side (chaotic bits)
      const side = Math.random();
      let x, y;
      if (side < 0.7) {
        // From left edges
        x = Math.random() * funnelX * 0.6;
        y = Math.random() * H;
      } else {
        // From top/bottom
        x = Math.random() * funnelX * 0.8;
        y = Math.random() < 0.5 ? -10 : H + 10;
      }

      return {
        x, y, ox: x, oy: y,
        phase: 0, // 0 = chaotic, 1 = converging, 2 = signal wave
        speed: 0.3 + Math.random() * 0.8,
        size: 1 + Math.random() * 2,
        opacity: 0.2 + Math.random() * 0.6,
        drift: (Math.random() - 0.5) * 0.8,
        driftY: (Math.random() - 0.5) * 0.5,
        waveOffset: Math.random() * Math.PI * 2,
        waveAmp: 15 + Math.random() * 25,
        life: 0,
        maxLife: 400 + Math.random() * 600,
      };
    }

    for (let i = 0; i < TOTAL; i++) {
      particles.push(createParticle());
    }
    particlesRef.current = particles;

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Funnel visualization — very subtle
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.02)";
      ctx.lineWidth = 1;
      // Funnel lines converging
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(funnelX, funnelY);
      ctx.moveTo(0, H);
      ctx.lineTo(funnelX, funnelY);
      ctx.stroke();
      ctx.restore();

      // Funnel point glow
      const grad = ctx.createRadialGradient(funnelX, funnelY, 0, funnelX, funnelY, 60);
      grad.addColorStop(0, "rgba(255,255,255,0.06)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(funnelX, funnelY, 60, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.life++;

        if (p.life > p.maxLife) {
          Object.assign(p, createParticle());
          continue;
        }

        const lifeRatio = p.life / p.maxLife;

        if (lifeRatio < 0.45) {
          // Phase 0: Chaotic movement toward funnel
          const toFunnelX = funnelX - p.x;
          const toFunnelY = funnelY - p.y;
          const dist = Math.sqrt(toFunnelX * toFunnelX + toFunnelY * toFunnelY);

          // Mouse repulsion in chaotic zone
          const mx = mouseRef.current.x - p.x;
          const my = mouseRef.current.y - p.y;
          const md = Math.sqrt(mx * mx + my * my);
          if (md < 120) {
            const repulse = (120 - md) / 120 * 2;
            p.x -= (mx / md) * repulse;
            p.y -= (my / md) * repulse;
          }

          // Drift + gravity toward funnel
          p.x += p.drift + (toFunnelX / dist) * p.speed * 0.5;
          p.y += p.driftY + (toFunnelY / dist) * p.speed * 0.3;

          // Random jitter
          p.x += (Math.random() - 0.5) * 1.2;
          p.y += (Math.random() - 0.5) * 1.2;

          p.phase = 0;
        } else if (lifeRatio < 0.55) {
          // Phase 1: Converging through funnel
          const t = (lifeRatio - 0.45) / 0.1;
          p.x = funnelX + t * 40;
          p.y = funnelY + (p.oy - funnelY) * (1 - t) * 0.1;
          p.phase = 1;
        } else {
          // Phase 2: Organized sine wave flowing right
          const t = (lifeRatio - 0.55) / 0.45;
          p.x = funnelX + 40 + t * (W - funnelX);
          p.y = funnelY + Math.sin(t * Math.PI * 3 + p.waveOffset) * p.waveAmp * (1 - t * 0.3);
          p.phase = 2;
        }

        // Draw
        const fadeIn = Math.min(p.life / 30, 1);
        const fadeOut = Math.max(1 - (p.life - p.maxLife + 60) / 60, 0);
        const alpha = p.opacity * fadeIn * Math.min(fadeOut, 1);

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.phase === 2 ? p.size * 0.8 : p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.phase === 2
          ? `rgba(255,255,255,${alpha * 0.9})`
          : `rgba(255,255,255,${alpha * 0.5})`;
        ctx.fill();

        // Trail for signal phase
        if (p.phase === 2 && alpha > 0.2) {
          ctx.beginPath();
          ctx.arc(p.x - 3, p.y, p.size * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${alpha * 0.2})`;
          ctx.fill();
        }
      }

      // Signal line (right side) — faint continuous sine
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      const time = Date.now() * 0.001;
      for (let x = funnelX + 40; x < W; x += 2) {
        const t = (x - funnelX - 40) / (W - funnelX - 40);
        const y = funnelY + Math.sin(t * Math.PI * 3 + time) * 30;
        x === funnelX + 40 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();

      animRef.current = requestAnimationFrame(draw);
    }

    animRef.current = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(animRef.current);
      window.removeEventListener("resize", resize);
      window.removeEventListener("mousemove", handleMouse);
    };
  }, []);

  return <canvas ref={canvasRef} className="bit-canvas" />;
}

// ═══════════════════════════════════════════════
// TYPING EFFECT
// ═══════════════════════════════════════════════
function TypedText({ text, delay = 0, speed = 40 }) {
  const [displayed, setDisplayed] = useState("");
  const [started, setStarted] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setStarted(true), delay);
    return () => clearTimeout(t);
  }, [delay]);

  useEffect(() => {
    if (!started) return;
    let i = 0;
    const interval = setInterval(() => {
      i++;
      setDisplayed(text.slice(0, i));
      if (i >= text.length) clearInterval(interval);
    }, speed);
    return () => clearInterval(interval);
  }, [started, text, speed]);

  return <span>{displayed}<span className="cursor">_</span></span>;
}

// ═══════════════════════════════════════════════
// BETA CTA
// ═══════════════════════════════════════════════
function BetaCTA() {
  const [email, setEmail] = useState("");
  const [status, setStatus] = useState("idle"); // idle | loading | success | error
  const [errorMsg, setErrorMsg] = useState("");
  const [r, v] = useReveal();

  const submit = async (e) => {
    e.preventDefault();
    if (!email.includes("@")) return;

    setStatus("loading");
    setErrorMsg("");

    if (!supabase) {
      console.warn("Supabase client not initialized — running in demo mode");
      setStatus("success");
      return;
    }

    try {
      console.log("Inserting email:", email.trim().toLowerCase());
      const { data, error } = await supabase
        .from("subscribers")
        .insert([{ email: email.trim().toLowerCase() }])
        .select();

      console.log("Supabase response:", { data, error });

      if (error) {
        if (error.code === "23505") {
          setStatus("success");
        } else {
          throw error;
        }
      } else {
        setStatus("success");
      }
    } catch (err) {
      console.error("Supabase insert error:", err);
      setStatus("error");
      setErrorMsg(err.message || "Something went wrong. Please try again.");
    }
  };

  return (
    <section className="beta" id="join" ref={r}>
      <div className={`beta__inner${v ? " vis" : ""}`}>
        <div className="beta__num">06</div>
        <div className="beta__urgent">
          <span className="beta__urgent-dot" />
          ACCEPTING TESTERS NOW
        </div>
        <h2 className="beta__h2">Shape the final release.</h2>
        <p className="beta__p">
          Hean launches soon and we're looking for 50 audiophiles to stress-test
          before release. Report bugs, suggest features, break things. Early testers
          get the final release for free — no strings attached.
        </p>
        {status === "success" ? (
          <div className="beta__thanks">
            ✓ You're on the list. We'll reach out soon.
          </div>
        ) : (
          <form className="beta__form" onSubmit={submit}>
            <input
              type="email"
              placeholder="your@email.com"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              required
              disabled={status === "loading"}
            />
            <button type="submit" disabled={status === "loading"}>
              {status === "loading" ? "Sending..." : "Request Access"}
            </button>
          </form>
        )}
        {status === "error" && (
          <div className="beta__error">{errorMsg}</div>
        )}
        <div className="beta__note">
          No spam. No account. Just an email when the build is ready for you.
        </div>
      </div>
    </section>
  );
}

  display:flex;justify-content:center;gap:24px;flex-wrap:wrap;
  padding:0 24px;
  opacity:0;animation:fadeIn 1s ease-out 1.6s both;
}
.hero__footer span{
  font-size:9px;letter-spacing:3px;color:#888;text-transform:uppercase;font-weight:400;
}

@media(max-width:768px){
  .hero__h1{letter-spacing:-1px;white-space:normal;font-size:clamp(28px,8vw,48px)}
  .hero__countdown{gap:16px}
  .hero__countdown-val{font-size:22px}
  .hero__countdown-sep{height:24px}
  .hero__actions{flex-direction:column;align-items:center}
  .btn-main,.btn-ghost{width:100%;max-width:260px;text-align:center}
  .hero__footer{gap:12px}
  .hero__footer span{font-size:8px;letter-spacing:2px}
}

/* ─── ABOUT ─── */
.about{padding:140px 32px;max-width:900px;margin:0 auto}
.about__inner{display:grid;grid-template-columns:60px 1fr;gap:32px;opacity:0;transform:translateY(20px);transition:all .8s ease}
.about__inner.vis{opacity:1;transform:translateY(0)}
.about__num{font-size:10px;letter-spacing:3px;color:#777;padding-top:6px}
.about__lead{font-size:clamp(17px,2.2vw,21px);line-height:1.7;font-weight:400;color:#ddd;margin-bottom:20px}
.about__sub{font-size:14px;line-height:1.8;color:#aaa;font-weight:400}

@media(max-width:768px){
  .about{padding:80px 20px}
  .about__inner{grid-template-columns:1fr;gap:16px}
}

/* ─── FEATURES ─── */
.feat{padding:100px 32px;max-width:1200px;margin:0 auto}
.feat__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.feat__item{
  padding:40px 32px;border-top:1px solid #111;
  opacity:0;transform:translateY(12px);transition:all .6s ease;
}
.feat__item.vis{opacity:1;transform:translateY(0)}
.feat__top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.feat__icon{opacity:0.6;transition:opacity .3s}
.feat__item:hover .feat__icon{opacity:1}
.feat__id{font-size:9px;letter-spacing:3px;color:#888}
.feat__title{font-size:16px;font-weight:400;letter-spacing:1px;margin-bottom:12px}
.feat__body{font-size:13px;line-height:1.8;color:#aaa;font-weight:400}
.feat__line{width:20px;height:1px;background:#222;margin-top:24px}

@media(max-width:768px){
  .feat{padding:60px 20px}
  .feat__grid{grid-template-columns:1fr}
}

/* ─── SPECS ─── */
.specs{padding:100px 32px;max-width:1200px;margin:0 auto}
.specs__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.specs__item{
  padding:40px 0;border-top:1px solid #111;text-align:center;
  opacity:0;transform:translateY(12px);transition:all .6s ease;
}
.specs__item.vis{opacity:1;transform:translateY(0)}
.specs__val{font-size:clamp(36px,6vw,64px);font-weight:200;letter-spacing:-2px;line-height:1}
.specs__unit{font-size:0.4em;color:#888;letter-spacing:0}
.specs__label{font-size:9px;letter-spacing:3px;color:#888;margin-top:16px;text-transform:uppercase}

@media(max-width:768px){
  .specs{padding:60px 20px}
  .specs__grid{grid-template-columns:repeat(2,1fr)}
}

/* ─── SIGNAL ─── */
.signal{padding:80px 32px;max-width:1000px;margin:0 auto}
.signal__flow{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap}
.signal__step{
  text-align:center;padding:24px 20px;
  opacity:0;transform:translateY(8px);transition:all .5s ease;
}
.signal__step.vis{opacity:1;transform:translateY(0)}
.signal__icon{margin-bottom:10px;opacity:0.5}
.signal__step:hover .signal__icon{opacity:1}
.signal__step-label{display:block;font-size:11px;letter-spacing:3px;font-weight:400;margin-bottom:4px}
.signal__step-sub{display:block;font-size:10px;color:#aaa;letter-spacing:1px}
.signal__arrow{color:#777;font-size:16px;padding:0 8px;opacity:0;transition:opacity .5s ease}
.signal__arrow.vis{opacity:1}
.signal__badge{
  text-align:center;margin-top:32px;font-size:10px;letter-spacing:3px;color:#777;
  opacity:0;transition:opacity .6s ease .5s;
}
.signal__badge.vis{opacity:1}
.signal__dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:8px;vertical-align:middle;animation:blink 2s ease-in-out infinite}

@media(max-width:768px){
  .signal{padding:60px 20px}
  .signal__flow{flex-direction:column;gap:4px}
  .signal__arrow{transform:rotate(90deg)}
}

/* ─── COMPARE ─── */
.cmp{padding:100px 32px;max-width:900px;margin:0 auto}
.cmp__wrap{opacity:0;transform:translateY(16px);transition:all .7s ease}
.cmp__wrap.vis{opacity:1;transform:translateY(0)}
.cmp__scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cmp__scroll::-webkit-scrollbar{height:2px}
.cmp__scroll::-webkit-scrollbar-track{background:#000}
.cmp__scroll::-webkit-scrollbar-thumb{background:#222}
.cmp__table{width:100%;border-collapse:collapse;min-width:540px}
.cmp__corner{background:transparent;border-bottom:1px solid #111}
.cmp__th{
  font-size:10px;letter-spacing:3px;font-weight:400;color:#888;
  padding:20px 16px;text-align:center;border-bottom:1px solid #111;
}
.cmp__th--noir{
  color:#fff;border-top:1px solid #fff;position:relative;
}
.cmp__badge{
  display:block;font-size:8px;letter-spacing:2px;color:#888;margin-top:4px;font-weight:400;
}
.cmp__row{transition:background .15s}
.cmp__row:hover{background:rgba(255,255,255,0.01)}
.cmp__label{
  font-size:10px;letter-spacing:2px;color:#999;padding:14px 16px;
  border-bottom:1px solid #080808;white-space:nowrap;font-weight:400;
}
.cmp__val{
  text-align:center;padding:14px 16px;border-bottom:1px solid #080808;
  font-size:11px;letter-spacing:1px;font-weight:300;
}
.cmp__val--noir{background:rgba(255,255,255,0.015)}
.cmp__yes{color:#fff;font-weight:400}
.cmp__no{color:#999}
.cmp__txt{color:#999;font-size:10px;letter-spacing:1px}
.cmp__note{
  font-size:11px;color:#aaa;letter-spacing:1px;margin-top:24px;text-align:center;font-weight:400;
}

@media(max-width:768px){
  .cmp{padding:60px 20px}
}

/* ─── QUOTE ─── */
.quote{padding:120px 32px;text-align:center}
.quote__text{
  font-size:clamp(24px,5vw,48px);font-weight:200;
  line-height:1.3;letter-spacing:-1px;color:#fff;
  opacity:0;transform:scale(0.97);transition:all .8s ease;
}
.quote__text.vis{opacity:1;transform:scale(1)}

@media(max-width:768px){.quote{padding:80px 20px}}

/* ─── BETA CTA ─── */
.beta{padding:140px 32px;max-width:600px;margin:0 auto}
.beta__inner{opacity:0;transform:translateY(20px);transition:all .8s ease}
.beta__inner.vis{opacity:1;transform:translateY(0)}
.beta__num{font-size:10px;letter-spacing:3px;color:#777;margin-bottom:24px}
.beta__h2{font-size:clamp(24px,4vw,36px);font-weight:200;letter-spacing:-1px;margin-bottom:16px}
.beta__p{font-size:14px;line-height:1.8;color:#aaa;font-weight:400;margin-bottom:40px}
.beta__form{display:flex;gap:0;border:1px solid #222;border-radius:2px;overflow:hidden}
.beta__form input{
  flex:1;padding:14px 16px;background:transparent;color:#fff;border:none;
  font-family:'Geist Mono',monospace;font-size:12px;outline:none;letter-spacing:0.5px;font-weight:300;
}
.beta__form input::placeholder{color:#666}
.beta__form input:focus{background:rgba(255,255,255,0.02)}
.beta__form button{
  padding:14px 24px;background:#fff;color:#000;border:none;
  font-family:'Geist Mono',monospace;font-size:11px;font-weight:400;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .2s;
}
.beta__form button:hover{background:#ddd}
.beta__thanks{font-size:13px;color:#fff;letter-spacing:1px;padding:20px 0;animation:fadeIn .5s ease-out}
.beta__error{font-size:12px;color:#ff6b6b;margin-top:12px;letter-spacing:0.5px}
.beta__form button:disabled{opacity:0.5;cursor:not-allowed}
.beta__form input:disabled{opacity:0.5}
.beta__note{font-size:11px;color:#aaa;margin-top:16px;letter-spacing:1px;font-weight:400}

@media(max-width:768px){
  .beta{padding:80px 20px}
  .beta__form{flex-direction:column}
  .beta__form input{border-bottom:1px solid #111}
}

/* ─── URGENCY BANNER ─── */
.urgency{
  padding:20px 32px;text-align:center;border-bottom:1px solid #111;
  opacity:0;transform:translateY(-8px);transition:all .6s ease;
}
.urgency.vis{opacity:1;transform:translateY(0)}
.urgency__inner{
  display:inline-flex;align-items:center;gap:10px;
  font-size:10px;letter-spacing:4px;color:#999;
}
.urgency__dot{
  width:6px;height:6px;border-radius:50%;background:#fff;
  animation:blink 1.5s ease-in-out infinite;
}

/* ─── APP MOCKUP ─── */
.mockup{padding:80px 32px 100px;max-width:900px;margin:0 auto}
.mockup__inner{opacity:0;transform:translateY(24px);transition:all .9s ease}
.mockup__inner.vis{opacity:1;transform:translateY(0)}
.mockup__label{margin-bottom:32px}
.mockup__window{
  border:1px solid #222;border-radius:6px;overflow:hidden;
  background:#0a0a0a;
  box-shadow:0 40px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.03);
}
.mockup__titlebar{
  display:flex;align-items:center;padding:12px 16px;
  background:#111;border-bottom:1px solid #1a1a1a;gap:12px;
}
.mockup__dots{display:flex;gap:6px}
.mockup__dots span{width:10px;height:10px;border-radius:50%;background:#222;border:1px solid #333}
.mockup__title{font-size:11px;color:#444;letter-spacing:1px;flex:1;text-align:center;margin-right:40px}
.mockup__body{display:flex;min-height:280px}
.mockup__sidebar{
  width:180px;border-right:1px solid #151515;padding:16px 0;
  background:#0d0d0d;flex-shrink:0;
}
.mockup__search{
  display:flex;align-items:center;gap:6px;padding:6px 14px;margin:0 10px 16px;
  border:1px solid #1a1a1a;border-radius:4px;
}
.mockup__search-icon{font-size:11px;color:#333}
.mockup__search-text{font-size:10px;color:#333;letter-spacing:0.5px}
.mockup__nav-items{margin-bottom:20px}
.mockup__nav-item{
  padding:5px 18px;font-size:10px;color:#555;letter-spacing:0.5px;
  cursor:default;transition:color .15s;
}
.mockup__nav-item.active{color:#fff;background:rgba(255,255,255,0.03)}
.mockup__nav-item--sub{font-size:9px;color:#333;padding:4px 24px}
.mockup__sidebar-section{border-top:1px solid #151515;padding-top:12px;margin-top:8px}
.mockup__sidebar-label{font-size:8px;letter-spacing:2px;color:#333;padding:4px 18px 8px;text-transform:uppercase}
.mockup__main{flex:1;padding:16px 20px;overflow:hidden}
.mockup__albums-label{font-size:10px;letter-spacing:2px;color:#444;margin-bottom:16px;text-transform:uppercase}
.mockup__album-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mockup__album{overflow:hidden}
.mockup__album-art{
  width:100%;aspect-ratio:1;background:#151515;border-radius:2px;
  margin-bottom:6px;
}
.mockup__album-title{width:70%;height:6px;background:#1a1a1a;border-radius:2px;margin-bottom:3px}
.mockup__album-artist{width:50%;height:5px;background:#111;border-radius:2px}
.mockup__player{
  display:flex;align-items:center;padding:10px 16px;
  border-top:1px solid #151515;background:#0a0a0a;gap:16px;
}
.mockup__player-left{display:flex;align-items:center;gap:10px;min-width:160px}
.mockup__player-art{width:32px;height:32px;background:#1a1a1a;border-radius:2px}
.mockup__player-info{overflow:hidden}
.mockup__player-track{font-size:10px;color:#ccc;letter-spacing:0.3px;white-space:nowrap}
.mockup__player-artist{font-size:9px;color:#444;letter-spacing:0.3px}
.mockup__player-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.mockup__player-controls{display:flex;align-items:center;gap:16px;font-size:10px;color:#555}
.mockup__play-btn{font-size:14px;color:#fff}
.mockup__progress{width:100%;max-width:300px;height:2px;background:#1a1a1a;border-radius:1px;position:relative}
.mockup__progress-fill{position:absolute;left:0;top:0;height:100%;width:35%;background:#fff;border-radius:1px}
.mockup__player-time{display:flex;justify-content:space-between;width:100%;max-width:300px;font-size:8px;color:#333}
.mockup__player-right{display:flex;align-items:center;gap:8px;min-width:100px;justify-content:flex-end}
.mockup__badge-format,.mockup__badge-res{
  font-size:8px;letter-spacing:1px;color:#555;
  border:1px solid #222;padding:2px 6px;border-radius:2px;
}

@media(max-width:768px){
  .mockup{padding:40px 16px 60px}
  .mockup__body{flex-direction:column}
  .mockup__sidebar{width:100%;border-right:none;border-bottom:1px solid #151515;padding:12px 0;min-height:auto}
  .mockup__nav-items{display:flex;gap:0;overflow-x:auto;padding:0 10px}
  .mockup__nav-item{white-space:nowrap;padding:5px 12px}
  .mockup__sidebar-section{display:none}
  .mockup__album-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .mockup__main{padding:12px 14px}
  .mockup__player{flex-wrap:wrap;padding:8px 12px}
  .mockup__player-left{min-width:auto}
  .mockup__player-right{min-width:auto}
  .mockup__player-center{order:3;width:100%;margin-top:4px}
}

.mockup__caption{
  text-align:center;margin-top:20px;font-size:10px;letter-spacing:2px;color:#777;
}

/* ─── ROADMAP ─── */
.road{padding:100px 32px;max-width:1200px;margin:0 auto}
.road__grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#111}
.road__item{
  padding:36px 28px;background:#000;
  opacity:0;transform:translateY(16px);transition:all .6s ease;
  position:relative;overflow:hidden;
}
.road__item.vis{opacity:1;transform:translateY(0)}
.road__item::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);
}
.road__item:hover{background:#0a0a0a}
.road__icon-wrap{position:relative;margin-bottom:20px;width:fit-content}
.road__glow{
  position:absolute;inset:-8px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);
  transition:all .4s;pointer-events:none;
}
.road__item:hover .road__glow{
  background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 70%);
  inset:-12px;
}
.road__status{margin-bottom:14px}
.road__badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:8px;letter-spacing:2px;color:#888;
  padding:3px 8px;border:1px solid #333;border-radius:2px;
}
.road__badge--active{color:#fff;border-color:#333}
.road__badge-dot{
  width:4px;height:4px;border-radius:50%;background:#fff;
  animation:blink 1.5s ease-in-out infinite;
}
.road__title{font-size:15px;font-weight:400;letter-spacing:1px;margin-bottom:10px}
.road__body{font-size:13px;line-height:1.8;color:#aaa;font-weight:400}
.road__note{
  text-align:center;margin-top:32px;font-size:11px;color:#aaa;
  letter-spacing:1px;font-weight:400;
  opacity:0;transition:opacity .6s ease .4s;
}
.road__note.vis{opacity:1}

@media(max-width:1024px){
  .road__grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:860px){
  .road__grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .road{padding:60px 20px}
  .road__grid{grid-template-columns:1fr}
  .road__item{padding:28px 20px}
}

/* ─── BETA URGENT ─── */
.beta__urgent{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10px;letter-spacing:3px;color:#fff;
  margin-bottom:20px;padding:6px 14px;
  border:1px solid #333;border-radius:2px;
}
.beta__urgent-dot{
  width:6px;height:6px;border-radius:50%;background:#fff;
  animation:blink 1.2s ease-in-out infinite;
}

/* ─── FOOTER ─── */
.foot{padding:40px 32px;border-top:1px solid #0a0a0a}
.foot__inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.foot__left{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:4px;color:#888}
.foot__right{display:flex;align-items:center;gap:0;font-size:10px;color:#999;letter-spacing:1px;font-weight:400}
.foot__right a{color:#999;transition:color .2s}
.foot__right a:hover{color:#fff}
.foot__sep{margin:0 12px;color:#444}

@media(max-width:768px){
  .foot{padding:32px 20px}
  .foot__inner{flex-direction:column;gap:16px;text-align:center}
  .foot__right{flex-wrap:wrap;justify-content:center}
}
`;

// ═══════════════════════════════════════════════
// MAIN
// ═══════════════════════════════════════════════
function App() {
  useFonts();
  return (
    <React.Fragment>
      <style>{css}</style>
      <Nav />
      <Hero />
      <UrgencyBanner />
      <AppMockup />
      <About />
      <Features />
      <Specs />
      <Signal />
      <Compare />
      <Roadmap />
      <Quote />
      <BetaCTA />
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
