// ═══════════════════════════════════════════════
// HOOKS
// ═══════════════════════════════════════════════
function useReveal(threshold = 0.15) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); o.unobserve(el); } }, { threshold });
    o.observe(el);
    return () => o.disconnect();
  }, []);
  return [ref, v];
}

function useScrollProgress(ref) {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let ticking = false;
    const onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          const rect = el.getBoundingClientRect();
          const wH = window.innerHeight;
          const total = wH + rect.height;
          const scrolled = wH - rect.top;
          setProgress(Math.max(0, Math.min(1, scrolled / total)));
          ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return progress;
}

function lerp(progress, inRange, outRange) {
  const t = Math.max(0, Math.min(1, (progress - inRange[0]) / (inRange[1] - inRange[0])));
  return outRange[0] + t * (outRange[1] - outRange[0]);
}

// ═══════════════════════════════════════════════
// BITS-TO-SIGNAL CANVAS ANIMATION
// ═══════════════════════════════════════════════
function BitFieldCanvas() {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const particlesRef = useRef([]);
  const mouseRef = useRef({ x: 0, y: 0 });

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let W, H, funnelX, funnelY;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      funnelX = W * 0.52;
      funnelY = H * 0.5;
    }
    resize();
    window.addEventListener("resize", resize);

    const handleMouse = (e) => { mouseRef.current = { x: e.clientX, y: e.clientY }; };
    window.addEventListener("mousemove", handleMouse, { passive: true });

    // Particle pool — fewer on mobile for performance
    const TOTAL = W <= 768 ? 90 : 220;
    const particles = [];

    function createParticle() {
      // Random position on left side (chaotic bits)
      const side = Math.random();
      let x, y;
      if (side < 0.7) {
        // From left edges
        x = Math.random() * funnelX * 0.6;
        y = Math.random() * H;
      } else {
        // From top/bottom
        x = Math.random() * funnelX * 0.8;
        y = Math.random() < 0.5 ? -10 : H + 10;
      }

      return {
        x, y, ox: x, oy: y,
        phase: 0, // 0 = chaotic, 1 = converging, 2 = signal wave
        speed: 0.3 + Math.random() * 0.8,
        size: 1 + Math.random() * 2,
        opacity: 0.2 + Math.random() * 0.6,
        drift: (Math.random() - 0.5) * 0.8,
        driftY: (Math.random() - 0.5) * 0.5,
        waveOffset: Math.random() * Math.PI * 2,
        waveAmp: 15 + Math.random() * 25,
        life: 0,
        maxLife: 400 + Math.random() * 600,
      };
    }

    for (let i = 0; i < TOTAL; i++) {
      particles.push(createParticle());
    }
    particlesRef.current = particles;

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Funnel visualization — very subtle
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.02)";
      ctx.lineWidth = 1;
      // Funnel lines converging
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(funnelX, funnelY);
      ctx.moveTo(0, H);
      ctx.lineTo(funnelX, funnelY);
      ctx.stroke();
      ctx.restore();

      // Funnel point glow
      const grad = ctx.createRadialGradient(funnelX, funnelY, 0, funnelX, funnelY, 60);
      grad.addColorStop(0, "rgba(255,255,255,0.06)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(funnelX, funnelY, 60, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.life++;

        if (p.life > p.maxLife) {
          Object.assign(p, createParticle());
          continue;
        }

        const lifeRatio = p.life / p.maxLife;

        if (lifeRatio < 0.45) {
          // Phase 0: Chaotic movement toward funnel
          const toFunnelX = funnelX - p.x;
          const toFunnelY = funnelY - p.y;
          const dist = Math.sqrt(toFunnelX * toFunnelX + toFunnelY * toFunnelY);

          // Mouse repulsion in chaotic zone
          const mx = mouseRef.current.x - p.x;
          const my = mouseRef.current.y - p.y;
          const md = Math.sqrt(mx * mx + my * my);
          if (md < 120) {
            const repulse = (120 - md) / 120 * 2;
            p.x -= (mx / md) * repulse;
            p.y -= (my / md) * repulse;
          }

          // Drift + gravity toward funnel
          p.x += p.drift + (toFunnelX / dist) * p.speed * 0.5;
          p.y += p.driftY + (toFunnelY / dist) * p.speed * 0.3;

          // Random jitter
          p.x += (Math.random() - 0.5) * 1.2;
          p.y += (Math.random() - 0.5) * 1.2;

          p.phase = 0;
        } else if (lifeRatio < 0.55) {
          // Phase 1: Converging through funnel
          const t = (lifeRatio - 0.45) / 0.1;
          p.x = funnelX + t * 40;
          p.y = funnelY + (p.oy - funnelY) * (1 - t) * 0.1;
          p.phase = 1;
        } else {
          // Phase 2: Organized sine wave flowing right
          const t = (lifeRatio - 0.55) / 0.45;
          p.x = funnelX + 40 + t * (W - funnelX);
          p.y = funnelY + Math.sin(t * Math.PI * 3 + p.waveOffset) * p.waveAmp * (1 - t * 0.3);
          p.phase = 2;
        }

        // Draw
        const fadeIn = Math.min(p.life / 30, 1);
        const fadeOut = Math.max(1 - (p.life - p.maxLife + 60) / 60, 0);
        const alpha = p.opacity * fadeIn * Math.min(fadeOut, 1);

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.phase === 2 ? p.size * 0.8 : p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.phase === 2
          ? `rgba(255,255,255,${alpha * 0.9})`
          : `rgba(255,255,255,${alpha * 0.5})`;
        ctx.fill();

        // Trail for signal phase
        if (p.phase === 2 && alpha > 0.2) {
          ctx.beginPath();
          ctx.arc(p.x - 3, p.y, p.size * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${alpha * 0.2})`;
          ctx.fill();
        }
      }

      // Signal line (right side) — faint continuous sine
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      const time = Date.now() * 0.001;
      for (let x = funnelX + 40; x < W; x += 2) {
        const t = (x - funnelX - 40) / (W - funnelX - 40);
        const y = funnelY + Math.sin(t * Math.PI * 3 + time) * 30;
        x === funnelX + 40 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();

      animRef.current = requestAnimationFrame(draw);
    }

    animRef.current = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(animRef.current);
      window.removeEventListener("resize", resize);
      window.removeEventListener("mousemove", handleMouse);
    };
  }, []);

  return <canvas ref={canvasRef} className="bit-canvas" />;
}

// ═══════════════════════════════════════════════
// TEXT SCRAMBLE EFFECT
// ═══════════════════════════════════════════════
const scrambleChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

function TextScramble({ children, duration = 0.8, speed = 0.04, delay = 0, className }) {
  const [displayText, setDisplayText] = useState("");
  const [started, setStarted] = useState(false);
  const text = children;

  useEffect(() => {
    const t = setTimeout(() => setStarted(true), delay);
    return () => clearTimeout(t);
  }, [delay]);

  useEffect(() => {
    if (!started) return;
    const steps = duration / speed;
    let step = 0;
    const interval = setInterval(() => {
      let scrambled = "";
      const progress = step / steps;
      for (let i = 0; i < text.length; i++) {
        if (text[i] === " ") {
          scrambled += " ";
        } else if (progress * text.length > i) {
          scrambled += text[i];
        } else {
          scrambled += scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
        }
      }
      setDisplayText(scrambled);
      step++;
      if (step > steps) {
        clearInterval(interval);
        setDisplayText(text);
      }
    }, speed * 1000);
    return () => clearInterval(interval);
  }, [started, text, duration, speed]);

  if (!started) return <span className={className} style={{ opacity: 0 }}>{text}</span>;
  return <span className={className}>{displayText}</span>;
}

// ═══════════════════════════════════════════════
// TYPING EFFECT
// ═══════════════════════════════════════════════
function TypedText({ text, delay = 0, speed = 40 }) {
  const [displayed, setDisplayed] = useState("");
  const [started, setStarted] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setStarted(true), delay);
    return () => clearTimeout(t);
  }, [delay]);

  useEffect(() => {
    if (!started) return;
    let i = 0;
    const interval = setInterval(() => {
      i++;
      setDisplayed(text.slice(0, i));
      if (i >= text.length) clearInterval(interval);
    }, speed);
    return () => clearInterval(interval);
  }, [started, text, speed]);

  return <span>{displayed}<span className="cursor">_</span></span>;
}

// APP SCREENSHOT — 3D SCROLL REVEAL
// ═══════════════════════════════════════════════
function AppMockup() {
  const containerRef = useRef(null);
  const progress = useScrollProgress(containerRef);
  const [isMobile, setIsMobile] = useState(false);

  useEffect(() => {
    const check = () => setIsMobile(window.innerWidth <= 768);
    check();
    window.addEventListener('resize', check);
    return () => window.removeEventListener('resize', check);
  }, []);

  const rotate = lerp(progress, [0.15, 0.65], [20, 0]);
  const scale = isMobile
    ? lerp(progress, [0.15, 0.65], [0.75, 0.95])
    : lerp(progress, [0.15, 0.65], [1.05, 1]);
  const translateY = lerp(progress, [0.15, 0.65], [0, -100]);
  const cardOpacity = lerp(progress, [0.1, 0.3], [0, 1]);

  return (
    <section className="scroll-mockup" ref={containerRef}>
      <div className="scroll-mockup__wrap">
        <div
          className="scroll-mockup__header"
          style={{ transform: `translateY(${translateY}px)` }}
        >
          <span className="label">THE APP</span>
        </div>
        <div
          className="scroll-mockup__card"
          style={{
            transform: `perspective(1000px) rotateX(${rotate}deg) scale(${scale})`,
            opacity: cardOpacity,
            boxShadow: `0 0 #0000004d, 0 ${9 + (1 - rotate / 20) * 20}px ${20 + (1 - rotate / 20) * 40}px #0000004a, 0 37px 37px #00000042, 0 84px 50px #00000026, 0 149px 60px #0000000a, 0 233px 65px #00000003`,
          }}
        >
          <div className="scroll-mockup__inner">
            <img
              src="app-screenshot.png"
              alt="Hean Desktop — lossless audio player for macOS"
              className="scroll-mockup__img"
              loading="lazy"
            />
          </div>
        </div>
        <div
          className="scroll-mockup__caption"
          style={{ transform: `translateY(${translateY}px)`, opacity: cardOpacity }}
        >
          Beta build — macOS Sonoma / Sequoia
        </div>
      </div>
    </section>
  );
}

// ═══════════════════════════════════════════════
// COUNTDOWN URGENCY BANNER
// ═══════════════════════════════════════════════
function UrgencyBanner() {

function useSpotsCount(total = 50) {
  const [taken, setTaken] = useState(0);
  useEffect(() => {
    if (!supabase) return;
    supabase
      .from("subscribers")
      .select("id", { count: "exact", head: true })
      .then(({ count }) => {
        if (typeof count === "number") setTaken(Math.min(count, total));
      });
  }, []);
  return taken;
}

function SpotsProgress({ taken, total = 50 }) {
  const remaining = Math.max(total - taken, 0);
  const pct = Math.min((taken / total) * 100, 100);
  return (
    <div className="spots">
      <div className="spots__header">
        <span className="spots__count">{remaining}</span>
        <span className="spots__label">SPOTS AVAILABLE</span>
      </div>
      <div className="spots__bar">
        <div className="spots__fill" style={{ width: `${pct}%` }} />
      </div>
      <div className="spots__hint">
        {remaining <= 0
          ? "THE FOUNDING TEAM IS COMPLETE — THANK YOU"
          : `${remaining} spots available — join a community of passionate audiophiles`}

    </div>
  );
}

// BETA CTA
// ═══════════════════════════════════════════════
function BetaCTA() {
  const [email, setEmail] = useState("");
  const [status, setStatus] = useState("idle"); // idle | loading | success | error
  const [errorMsg, setErrorMsg] = useState("");
  const [r, v] = useReveal();

  const submit = async (e) => {
    e.preventDefault();
    if (!email.includes("@")) return;

    setStatus("loading");
    setErrorMsg("");

    if (!supabase) {
      console.warn("Supabase client not initialized — running in demo mode");
      setStatus("success");
      return;
    }

    try {
      const utm = getUtmParams();
      console.log("Inserting email:", email.trim().toLowerCase(), "utm:", utm);
      const { data, error } = await supabase
        .from("subscribers")
        .insert([{ email: email.trim().toLowerCase(), ...utm }])
        .select();

      console.log("Supabase response:", { data, error });

      if (error) {
        if (error.code === "23505") {
          setStatus("success");
        } else {
          throw error;
        }
      } else {
        setStatus("success");
      }
    } catch (err) {
      console.error("Supabase insert error:", err);
      setStatus("error");
      setErrorMsg(err.message || "Something went wrong. Please try again.");
    }
  };

  return (
    <section className="beta" id="join" ref={r}>
      <div className={`beta__inner${v ? " vis" : ""}`}>
        <div className="beta__num">06</div>
        <div className="beta__urgent">
          <span className="beta__urgent-dot" />
          FOUNDING MEMBER ACCESS
        </div>
        <h2 className="beta__h2">Your feedback, our code — own it forever.</h2>
        <p className="beta__p">
          We're looking for 50 audiophiles to test HEAN before launch.
          Try early builds, tell us what works and what doesn't, help us get
          every detail right. In return, you own the final app for free —
          no subscription, no rental fees, no conditions. Ever.
        </p>
        {status === "success" ? (
          <div className="beta__success">
            <div className="beta__thanks">
              ✓ You're on the list. We'll reach out soon.
            </div>
            <div className="beta__share">
              <p className="beta__share-label">HELP SPREAD THE WORD</p>
              <div className="beta__share-buttons">
                <a
                  className="beta__share-btn"
                  href={`https://x.com/intent/tweet?text=${encodeURIComponent("I'm testing HEAN — a bit-perfect lossless audio player for macOS, built in Rust. 50 beta testers get the final app for free.\n\nhttps://thomasdugue.github.io/noir-landing/?utm_source=twitter&utm_medium=share")}`}
                  target="_blank"
                  rel="noopener"
                >
                  Share on X/Twitter
                </a>
                <button
                  className="beta__share-btn"
                  onClick={() => {
                    navigator.clipboard.writeText("https://thomasdugue.github.io/noir-landing/?utm_source=copy&utm_medium=share");
                    document.querySelector('.beta__copied').style.opacity = '1';
                    setTimeout(() => document.querySelector('.beta__copied').style.opacity = '0', 2000);
                  }}
                >
                  Copy link
                </button>
              </div>
              <span className="beta__copied">Copied!</span>
            </div>
          </div>
        ) : (
          <form className="beta__form" onSubmit={submit}>
            <input
              type="email"
              placeholder="your@email.com"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              required
              disabled={status === "loading"}
            />
            <button type="submit" disabled={status === "loading"}>
              {status === "loading" ? "Sending..." : "Request Access"}
            </button>
          </form>
        )}
        {status === "error" && (
          <div className="beta__error">{errorMsg}</div>
        )}
        <div className="beta__note">
          No spam. No account required. Just your ears and your honest feedback.
        </div>
      </div>
    </section>
  );
}

// FEATURE REQUEST POPOVER
// ═══════════════════════════════════════════════
function FeatureRequestPopover() {
  const [open, setOpen] = useState(false);
  const [message, setMessage] = useState("");
  const [email, setEmail] = useState("");
  const [joinBeta, setJoinBeta] = useState(false);
  const [status, setStatus] = useState("idle");
  const [errorMsg, setErrorMsg] = useState("");
  const formRef = useRef(null);

  // Click outside to close
  useEffect(() => {
    if (!open) return;
    const handler = (e) => {
      if (formRef.current && !formRef.current.contains(e.target)) {
        setOpen(false);
      }
    };
    document.addEventListener("mousedown", handler);
    document.addEventListener("touchstart", handler);
    return () => {
      document.removeEventListener("mousedown", handler);
      document.removeEventListener("touchstart", handler);
    };
  }, [open]);

  // Auto-close on success
  useEffect(() => {
    if (status === "success") {
      const t = setTimeout(() => {
        setOpen(false);
        setStatus("idle");
        setMessage("");
        setEmail("");
        setJoinBeta(false);
      }, 2500);
      return () => clearTimeout(t);
    }
  }, [status]);

  const submit = async (e) => {
    e.preventDefault();
    if (!message.trim()) return;

    setStatus("loading");
    setErrorMsg("");

    if (!supabase) {
      console.warn("Supabase not configured — demo mode");
      setStatus("success");
      return;
    }

    try {
      const payload = {
        message: message.trim(),
        email: email.trim().toLowerCase() || null,
        join_beta: joinBeta,
      };
      const { error } = await supabase
        .from("feature_requests")
        .insert([payload]);

      if (error) throw error;
      setStatus("success");
    } catch (err) {
      console.error("Feature request error:", err);
      setStatus("error");
      setErrorMsg(err.message || "Something went wrong.");
    }
  };

  if (!open) {
    return (
      <div className="road__cta">
        <button className="btn-ghost" onClick={() => setOpen(true)}>
          Suggest a feature
        </button>
      </div>
    );
  }

  return (
    <React.Fragment>
      <div className="feat-form__overlay" />
      <div className="feat-form" ref={formRef}>
        {status === "success" ? (
          <div className="feat-form__success">
            <span className="feat-form__check-icon">✓</span>
            <span>Thanks! We'll consider your suggestion.</span>
          </div>
        ) : (
          <form className="feat-form__inner" onSubmit={submit}>
            <div className="feat-form__header">
              <span className="feat-form__title">SUGGEST A FEATURE</span>
              <button type="button" className="feat-form__close" onClick={() => setOpen(false)}>✕</button>
            </div>
            <textarea
              className="feat-form__textarea"
              placeholder="What would you like to see next?"
              value={message}
              onChange={(e) => setMessage(e.target.value)}
              required
              disabled={status === "loading"}
              rows={4}
            />
            <input
              type="email"
              className="feat-form__email"
              placeholder="your@email.com (optional)"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              disabled={status === "loading"}
            />
            <label className="feat-form__checkbox">
              <input
                type="checkbox"
                checked={joinBeta}
                onChange={(e) => setJoinBeta(e.target.checked)}
                disabled={status === "loading"}
              />
              <span className="feat-form__checkbox-box" />
              <span>I'd like to join the beta too</span>
            </label>
            {status === "error" && (
              <div className="feat-form__error">{errorMsg}</div>
            )}
            <button
              type="submit"
              className="feat-form__submit"
              disabled={status === "loading"}
            >
              {status === "loading" ? "Sending..." : "Send"}
            </button>
          </form>
        )}
      </div>
    </React.Fragment>
  );
}

  padding:20px 20px;text-align:center;border-bottom:1px solid #222;
}
.cmp__th--noir{
  color:#fff;position:relative;
  background:rgba(255,255,255,0.04);
  border-top:2px solid #fff;
}
.cmp__badge{
  display:block;font-size:8px;letter-spacing:2px;color:#888;margin-top:4px;font-weight:400;
}
.cmp__row{transition:background .15s}
.cmp__row:hover{background:rgba(255,255,255,0.02)}
.cmp__row:nth-child(even){background:rgba(255,255,255,0.01)}
.cmp__row:nth-child(even):hover{background:rgba(255,255,255,0.03)}
.cmp__label{
  font-size:11px;letter-spacing:2px;color:#aaa;padding:16px 20px;
  border-bottom:1px solid #1a1a1a;white-space:nowrap;font-weight:400;
}
.cmp__val{
  text-align:center;padding:16px 20px;border-bottom:1px solid #1a1a1a;
  font-size:12px;letter-spacing:1px;font-weight:300;
}
.cmp__val--noir{background:rgba(255,255,255,0.04)}
.cmp__row:nth-child(even) .cmp__val--noir{background:rgba(255,255,255,0.05)}
.cmp__yes{color:#fff;font-weight:500}
.cmp__no{color:#444}
.cmp__txt{color:#888;font-size:11px;letter-spacing:1px}
.cmp__note{
  font-size:11px;color:#888;letter-spacing:1px;margin-top:24px;text-align:center;font-weight:400;
}
.cmp__source{
  font-size:9px;color:#444;letter-spacing:1px;margin-top:10px;text-align:center;font-weight:300;
}

@media(max-width:768px){
  .cmp{padding:60px 12px}
  .cmp__table{min-width:420px}
  .cmp__th{padding:12px 8px;font-size:9px;letter-spacing:1.5px}
  .cmp__label{padding:10px 8px;font-size:9px;letter-spacing:1px}
  .cmp__val{padding:10px 8px;font-size:10px}
  .cmp__note{font-size:10px;padding:0 4px}
  .cmp__source{font-size:8px}
}

/* ─── QUOTE ─── */
.quote{padding:120px 32px;text-align:center}
.quote__text{
  font-size:clamp(24px,5vw,48px);font-weight:200;
  line-height:1.3;letter-spacing:-1px;color:#fff;
  opacity:0;transform:scale(0.97);transition:all .8s ease;
}
.quote__text.vis{opacity:1;transform:scale(1)}

@media(max-width:768px){.quote{padding:60px 16px}
  .quote__text{font-size:clamp(20px,6vw,36px)}
}

/* ─── BETA CTA ─── */
.beta{padding:140px 32px;max-width:600px;margin:0 auto}
.beta__inner{opacity:0;transform:translateY(20px);transition:all .8s ease}
.beta__inner.vis{opacity:1;transform:translateY(0)}
.beta__num{font-size:10px;letter-spacing:3px;color:#777;margin-bottom:24px}
.beta__h2{font-size:clamp(24px,4vw,36px);font-weight:200;letter-spacing:-1px;margin-bottom:16px}
.beta__p{font-size:14px;line-height:1.8;color:#aaa;font-weight:400;margin-bottom:40px}
.beta__form{display:flex;gap:0;border:1px solid #222;border-radius:2px;overflow:hidden}
.beta__form input{
  flex:1;padding:14px 16px;background:transparent;color:#fff;border:none;
  font-family:'Geist Mono',monospace;font-size:12px;outline:none;letter-spacing:0.5px;font-weight:300;
}
.beta__form input::placeholder{color:#666}
.beta__form input:focus{background:rgba(255,255,255,0.02)}
.beta__form button{
  padding:14px 24px;background:#fff;color:#000;border:none;
  font-family:'Geist Mono',monospace;font-size:11px;font-weight:400;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .2s;
}
.beta__form button:hover{background:#ddd}
.beta__success{animation:fadeIn .5s ease-out}
.beta__thanks{font-size:13px;color:#fff;letter-spacing:1px;padding:20px 0}
.beta__share{margin-top:16px;padding-top:20px;border-top:1px solid #111}
.beta__share-label{font-size:9px;letter-spacing:3px;color:#888;text-transform:uppercase;margin-bottom:14px}
.beta__share-buttons{display:flex;gap:10px;flex-wrap:wrap}
.beta__share-btn{
  font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:400;
  padding:10px 20px;color:#fff;background:transparent;
  border:1px solid #333;border-radius:2px;cursor:pointer;transition:all .2s;
  text-decoration:none;display:inline-block;
}
.beta__share-btn:hover{border-color:#fff;background:rgba(255,255,255,0.05)}
.beta__copied{font-size:10px;color:#888;letter-spacing:1px;margin-left:8px;opacity:0;transition:opacity .3s}
.beta__error{font-size:12px;color:#ff6b6b;margin-top:12px;letter-spacing:0.5px}
.beta__form button:disabled{opacity:0.5;cursor:not-allowed}
.beta__form input:disabled{opacity:0.5}
.beta__note{font-size:11px;color:#aaa;margin-top:16px;letter-spacing:1px;font-weight:400}

@media(max-width:768px){
  .beta{padding:80px 16px}
  .beta__form{flex-direction:column}
  .beta__form input{border-bottom:1px solid #111;font-size:16px;padding:16px}
  .beta__form button{padding:16px 24px;font-size:12px;min-height:48px}
  .beta__p{font-size:13px}
  .beta__share-buttons{flex-direction:column}
  .beta__share-btn{text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center}
}

/* ─── URGENCY BANNER ─── */
.urgency{
  padding:28px 32px;text-align:center;
  border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);
  background:linear-gradient(180deg,rgba(255,255,255,0.02) 0%,transparent 100%);
  opacity:0;transform:translateY(-8px);transition:all .6s ease;
}
.urgency.vis{opacity:1;transform:translateY(0)}
.urgency__inner{
  display:inline-flex;align-items:center;gap:12px;
  font-size:10px;letter-spacing:4px;color:#999;
}
.urgency__text{
  font-size:14px;letter-spacing:5px;font-weight:500;color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,0.4);
  animation:shineText 3s ease-in-out infinite;
}
@keyframes shineText{0%,100%{text-shadow:0 0 10px rgba(255,255,255,0.4)}50%{text-shadow:0 0 20px rgba(255,255,255,0.6),0 0 40px rgba(255,255,255,0.15)}}
.urgency__dot{
  width:8px;height:8px;border-radius:50%;background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,0.5);
  animation:blink 1.5s ease-in-out infinite;
}

@media(max-width:768px){
  .urgency{padding:20px 16px}
  .urgency__text{font-size:10px;letter-spacing:2px}
  .urgency__inner{gap:8px}
}

/* ─── APP MOCKUP (3D SCROLL) ─── */
.scroll-mockup{
  height:80rem;
  display:flex;align-items:center;justify-content:center;
  position:relative;padding:8px 20px;
}
.scroll-mockup__wrap{
  padding:40px 0;width:100%;position:relative;
}
.scroll-mockup__header{
  max-width:1200px;margin:0 auto 32px;
  text-align:left;padding:0 12px;
  will-change:transform;
}
.scroll-mockup__card{
  max-width:1200px;margin:0 auto;width:100%;
  border:3px solid #555;padding:6px;
  background:#181818;border-radius:24px;
  transform-origin:center top;
  will-change:transform,opacity;
}
.scroll-mockup__inner{
  width:100%;overflow:hidden;
  border-radius:18px;background:#0a0a0a;
}
.scroll-mockup__img{
  display:block;width:100%;height:auto;
}
.scroll-mockup__caption{
  text-align:center;margin-top:24px;
  font-size:10px;letter-spacing:2px;color:#777;
  will-change:transform,opacity;
}

@media(max-width:768px){
  .scroll-mockup{height:36rem;padding:4px 10px}
  .scroll-mockup__wrap{padding:20px 0}
  .scroll-mockup__card{padding:3px;border-width:2px;border-radius:12px}
  .scroll-mockup__inner{border-radius:8px}
  .scroll-mockup__header{padding:0 4px;margin-bottom:16px}
  .scroll-mockup__caption{margin-top:16px;font-size:9px}
}

/* ─── ROADMAP ─── */
.road{padding:100px 32px;max-width:1200px;margin:0 auto}
.road__grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#111}
.road__item{
  padding:36px 28px;background:#000;
  opacity:0;transform:translateY(16px);transition:all .6s ease;
  position:relative;overflow:hidden;
}
.road__item.vis{opacity:1;transform:translateY(0)}
.road__item::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);
}
.road__item:hover{background:#0a0a0a}
.road__icon-wrap{position:relative;margin-bottom:20px;width:fit-content}
.road__glow{
  position:absolute;inset:-8px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);
  transition:all .4s;pointer-events:none;
}
.road__item:hover .road__glow{
  background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 70%);
  inset:-12px;
}
.road__status{margin-bottom:14px}
.road__badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:8px;letter-spacing:2px;color:#888;
  padding:3px 8px;border:1px solid #333;border-radius:2px;
}
.road__badge--active{color:#fff;border-color:#333}
.road__badge-dot{
  width:4px;height:4px;border-radius:50%;background:#fff;
  animation:blink 1.5s ease-in-out infinite;
}
.road__title{font-size:15px;font-weight:400;letter-spacing:1px;margin-bottom:10px}
.road__body{font-size:13px;line-height:1.8;color:#aaa;font-weight:400}
.road__note{
  text-align:center;margin-top:32px;font-size:11px;color:#aaa;
  letter-spacing:1px;font-weight:400;
  opacity:0;transition:opacity .6s ease .4s;
}
.road__note.vis{opacity:1}

@media(max-width:1024px){
  .road__grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:860px){
  .road__grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .road{padding:60px 16px}
  .road__grid{grid-template-columns:1fr}
  .road__item{padding:24px 16px}
  .road__title{font-size:14px}
  .road__body{font-size:12px}
}

/* ─── FEATURE REQUEST POPOVER ─── */
.road__cta{text-align:center;margin-top:28px}

.feat-form__overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  animation:featOverlayIn .25s ease both;
}
@keyframes featOverlayIn{from{opacity:0}to{opacity:1}}

.feat-form{
  position:fixed;z-index:201;
  top:50%;left:50%;transform:translate(-50%,-50%);
  width:90%;max-width:420px;
  background:#0a0a0a;border:1px solid #222;border-radius:6px;
  padding:0;
  animation:featFormIn .3s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes featFormIn{
  from{opacity:0;transform:translate(-50%,-50%) scale(0.92)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

.feat-form__inner{display:flex;flex-direction:column;gap:16px;padding:24px}

.feat-form__header{display:flex;justify-content:space-between;align-items:center}
.feat-form__title{font-size:10px;letter-spacing:3px;color:#888;font-weight:400;text-transform:uppercase}
.feat-form__close{
  background:none;border:none;color:#666;font-size:14px;cursor:pointer;
  padding:4px 8px;transition:color .2s;font-family:'Geist Mono',monospace;
}
.feat-form__close:hover{color:#fff}

.feat-form__textarea{
  width:100%;padding:12px 14px;background:#111;color:#fff;border:1px solid #222;
  border-radius:3px;font-family:'Geist Mono',monospace;font-size:13px;
  font-weight:300;letter-spacing:0.3px;line-height:1.6;
  resize:vertical;min-height:90px;outline:none;transition:border-color .2s;
}
.feat-form__textarea::placeholder{color:#555}
.feat-form__textarea:focus{border-color:#444}

.feat-form__email{
  width:100%;padding:12px 14px;background:#111;color:#fff;border:1px solid #222;
  border-radius:3px;font-family:'Geist Mono',monospace;font-size:13px;
  font-weight:300;letter-spacing:0.3px;outline:none;transition:border-color .2s;
}
.feat-form__email::placeholder{color:#555}
.feat-form__email:focus{border-color:#444}

.feat-form__checkbox{
  display:flex;align-items:center;gap:10px;cursor:pointer;
  font-size:12px;color:#aaa;letter-spacing:0.3px;font-weight:400;
}
.feat-form__checkbox input{display:none}
.feat-form__checkbox-box{
  width:16px;height:16px;border:1px solid #444;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.feat-form__checkbox input:checked + .feat-form__checkbox-box{
  background:#fff;border-color:#fff;
}
.feat-form__checkbox input:checked + .feat-form__checkbox-box::after{
  content:'✓';color:#000;font-size:11px;font-weight:600;
}

.feat-form__submit{
  width:100%;padding:13px 24px;background:#fff;color:#000;border:none;
  font-family:'Geist Mono',monospace;font-size:11px;font-weight:400;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  border-radius:2px;transition:background .2s;
}
.feat-form__submit:hover{background:#ddd}
.feat-form__submit:disabled{opacity:0.5;cursor:not-allowed}

.feat-form__error{font-size:11px;color:#ff6b6b;letter-spacing:0.5px}

.feat-form__success{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:40px 24px;text-align:center;
  animation:featSuccessIn .4s ease both;
}
@keyframes featSuccessIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.feat-form__check-icon{font-size:20px;color:#fff}
.feat-form__success span:last-child{font-size:13px;color:#aaa;letter-spacing:0.5px;font-weight:400}

@media(max-width:768px){
  .feat-form{width:calc(100% - 32px);max-width:none}
  .feat-form__inner{padding:20px 16px;gap:14px}
  .feat-form__textarea{font-size:16px;min-height:100px}
  .feat-form__email{font-size:16px}
  .feat-form__submit{padding:16px 24px;font-size:12px;min-height:48px}
}

/* ─── BETA URGENT ─── */
.beta__urgent{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10px;letter-spacing:3px;color:#fff;
  margin-bottom:20px;padding:6px 14px;
  border:1px solid #333;border-radius:2px;
}
.beta__urgent-dot{
  width:6px;height:6px;border-radius:50%;background:#fff;
  animation:blink 1.2s ease-in-out infinite;
}

/* ─── FOOTER ─── */
.foot{padding:40px 32px;border-top:1px solid #0a0a0a}
.foot__inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.foot__left{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:4px;color:#888}
.foot__right{display:flex;align-items:center;gap:0;font-size:10px;color:#999;letter-spacing:1px;font-weight:400}
.foot__right a{color:#999;transition:color .2s}
.foot__right a:hover{color:#fff}
.foot__sep{margin:0 12px;color:#444}

@media(max-width:768px){
  .foot{padding:32px 16px;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
  .foot__inner{flex-direction:column;gap:12px;text-align:center}
  .foot__right{flex-wrap:wrap;justify-content:center;gap:0;font-size:9px}
  .foot__sep{margin:0 8px}
}
`;

function App() {
  useFonts();
  return (
    <React.Fragment>
      <style>{css}</style>
      <Nav />
      <Hero />
      <UrgencyBanner />
      <AppMockup />
      <About />
      <Features />
      <Specs />
      <Signal />
      <Compare />
      <Roadmap />
      <Quote />
      <BetaCTA />
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
