// FONT LOADER
// ═══════════════════════════════════════════════
function useFonts() {
  useEffect(() => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href =
      "https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap";
    document.head.appendChild(link);
    return () => document.head.removeChild(link);
  }, []);
}

// ═══════════════════════════════════════════════
// HOOKS
// ═══════════════════════════════════════════════
function useReveal() {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setVisible(true); obs.unobserve(el); } },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function useCountUp(end, visible, duration = 1200) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!visible) return;
    const startTime = performance.now();
    function step(now) {
      const p = Math.min((now - startTime) / duration, 1);
      setVal(Math.round((1 - Math.pow(1 - p, 3)) * end));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }, [visible, end, duration]);
  return val;
}

function useMouseParallax(strength = 0.02) {
  const [offset, setOffset] = useState({ x: 0, y: 0 });
  useEffect(() => {
    const handler = (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      setOffset({
        x: (e.clientX - cx) * strength,
        y: (e.clientY - cy) * strength,
      });
    };
    window.addEventListener("mousemove", handler, { passive: true });
    return () => window.removeEventListener("mousemove", handler);
  }, [strength]);
  return offset;
}

// ANIMATED FLOATING PARTICLES (hero bg)
// ═══════════════════════════════════════════════
function HeroParticles() {
  const particles = useMemo(() =>
    Array.from({ length: 30 }, (_, i) => ({
      id: i,
      x: Math.random() * 100,
      y: Math.random() * 100,
      size: 1 + Math.random() * 2,
      dur: 15 + Math.random() * 25,
      delay: Math.random() * -30,
      opacity: 0.1 + Math.random() * 0.2,
    })), []);

  return (
    <div className="hero-particles">
      {particles.map(p => (
        <div
          key={p.id}
          className="particle"
          style={{
            left: `${p.x}%`,
            top: `${p.y}%`,
            width: p.size,
            height: p.size,
            opacity: p.opacity,
            animationDuration: `${p.dur}s`,
            animationDelay: `${p.delay}s`,
          }}
        />
      ))}
    </div>
  );
}

// ═══════════════════════════════════════════════
// ANIMATED WAVEFORM VISUALIZER (hero decoration)
// ═══════════════════════════════════════════════
function WaveformVisualizer() {
  const bars = 48;
  return (
    <div className="hero-waveform">
      {Array.from({ length: bars }, (_, i) => {
        const center = bars / 2;
        const dist = Math.abs(i - center) / center;
        const maxH = 60 * (1 - dist * 0.7);
        return (
          <div
            key={i}
            className="waveform-bar"
            style={{
              height: maxH,
              animationDelay: `${i * 0.05}s`,
              animationDuration: `${1.2 + Math.random() * 0.8}s`,
            }}
          />
        );
      })}
    </div>
  );
}

// NAVIGATION
// ═══════════════════════════════════════════════
function Nav() {
  const [scrolled, setScrolled] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  useEffect(() => {
    const handler = () => setScrolled(window.scrollY > 40);
    window.addEventListener("scroll", handler, { passive: true });
    return () => window.removeEventListener("scroll", handler);
  }, []);
  const scrollTo = useCallback((id) => {
    document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
    setMobileOpen(false);
  }, []);

  return (
    <nav className={`noir-nav${scrolled ? " scrolled" : ""}`}>
      <div className="nav-inner">
        <div className="nav-brand" onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}>
          <Logo size={28} color="#4a9" />
          <span className="nav-brand-text">NOIR</span>
        </div>
        <div className={`nav-links${mobileOpen ? " open" : ""}`}>
          <a onClick={() => scrollTo("features")}>Features</a>
          <a onClick={() => scrollTo("signal")}>How It Works</a>
          <a onClick={() => scrollTo("pricing")}>Pricing</a>
          <a className="nav-cta" onClick={() => scrollTo("download")}>Download</a>
        </div>
        <button className={`hamburger${mobileOpen ? " active" : ""}`} onClick={() => setMobileOpen(!mobileOpen)} aria-label="Menu">
          <span /><span /><span />
        </button>
      </div>
    </nav>
  );
}

              <span className="signal-label">{s.label}</span>
              <span className="signal-sub">{s.sub}</span>
            </div>
            {i < signalSteps.length - 1 && (
              <div className={`signal-connector${visible ? " visible" : ""}`} style={{ transitionDelay: `${i * 0.15 + 0.1}s` }}>
                <svg width="40" height="2" viewBox="0 0 40 2" className="connector-line">
                  <line x1="0" y1="1" x2="40" y2="1" stroke="#4a9" strokeWidth="2" strokeDasharray="4 4" />
                </svg>
                <div className="connector-dot" style={{ animationDelay: `${i * 0.3}s` }} />
              </div>
            )}
          </div>
        ))}
      </div>
      <div className={`signal-integrity${visible ? " visible" : ""}`}>
        <span className="integrity-dot" />
        Signal integrity: <strong>100%</strong>
      </div>
    </section>
  );
}

function EmailCTA() {

  return (
    <section className="email-cta" ref={ref}>
      <div className={`email-inner${visible ? " visible" : ""}`}>
        <h2>Join the beta.</h2>
        <p>Be first to hear your music the way it was meant to sound.</p>
        {submitted ? (

        ) : (
          <form className="email-form" onSubmit={handle}>
            <input type="email" placeholder="you@email.com" value={email} onChange={(e) => setEmail(e.target.value)} required />

          </form>
        )}

  .features-grid{grid-template-columns:1fr}
}

/* ─── QUOTE ─── */
.quote-section { padding:100px 24px; text-align:center; position:relative; background:#0e0e0e; }
.quote-grain { position:absolute; inset:0; background-image:url("${NOISE_SVG}"); background-repeat:repeat; background-size:256px; pointer-events:none; opacity:0.6; }
.quote-line { width:60px; height:1px; background:#333; margin:0 auto; }
.quote {
  font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-style:italic;
  font-size:clamp(28px,5vw,48px); padding:48px 24px; color:#fff;
  position:relative; opacity:0; transform:scale(0.96); transition:opacity .8s,transform .8s;
}
.quote.visible { opacity:1; transform:scale(1); }
.quote em { color:#4a9; font-style:italic; }

/* ─── STATS ─── */
.stats { padding:100px 24px; max-width:1000px; margin:0 auto; }
.stats-grid { display:flex; align-items:center; justify-content:center; }
.stat { flex:1; text-align:center; padding:20px; opacity:0; transform:translateY(16px); transition:opacity .6s ease,transform .6s ease; }
.stat.visible { opacity:1; transform:translateY(0); }
.stat-num { font-family:'Instrument Serif',Georgia,serif; font-size:clamp(48px,8vw,80px); font-weight:400; display:block; line-height:1; letter-spacing:-2px; }
.stat-unit { font-size:0.45em; color:#888; letter-spacing:0; }
.stat-label { font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:400; letter-spacing:2px; text-transform:uppercase; color:#555; margin-top:12px; display:block; }
.stat-sep { width:1px; height:60px; background:#222; }
@media(max-width:768px){
  .stats{padding:60px 20px}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
  .stat-sep{display:none}
}

/* ─── SIGNAL PATH ─── */
.signal { padding:120px 24px; max-width:1000px; margin:0 auto; }
.signal-pipeline { display:flex; align-items:center; justify-content:center; }
.signal-step-wrap { display:flex; align-items:center; }
.signal-step {
  background:#151515; border:1px solid #222; border-radius:12px;
  padding:24px 28px; text-align:center; min-width:140px;
  opacity:0; transform:translateY(12px); transition:opacity .5s ease,transform .5s ease;
}
.signal-step.visible { opacity:1; transform:translateY(0); }
.signal-icon { font-size:24px; display:block; margin-bottom:10px; }
.signal-label { font-weight:600; font-size:15px; display:block; margin-bottom:4px; }
.signal-sub { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#555; letter-spacing:0.5px; }
.signal-connector { display:flex; align-items:center; justify-content:center; width:56px; position:relative; opacity:0; transition:opacity .5s ease; }
.signal-connector.visible { opacity:1; }
.connector-dot { position:absolute; width:6px; height:6px; background:#4a9; border-radius:50%; animation:flowDot 1.5s ease-in-out infinite; box-shadow:0 0 8px rgba(68,170,153,0.6); }
@keyframes flowDot { 0%{left:0;opacity:0} 20%{opacity:1} 80%{opacity:1} 100%{left:calc(100% - 6px);opacity:0} }
.signal-integrity { text-align:center; margin-top:40px; font-family:'IBM Plex Mono',monospace; font-size:13px; color:#666; letter-spacing:1px; opacity:0; transition:opacity .6s ease .6s; }
.signal-integrity.visible { opacity:1; }
.integrity-dot { display:inline-block; width:8px; height:8px; background:#4a9; border-radius:50%; margin-right:8px; vertical-align:middle; animation:pulse 2s ease-in-out infinite; box-shadow:0 0 8px rgba(68,170,153,0.5); }
@keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 8px rgba(68,170,153,0.5)} 50%{opacity:0.5;box-shadow:0 0 16px rgba(68,170,153,0.8)} }
@media(max-width:768px){
  .signal{padding:80px 20px}
  .signal-pipeline{flex-direction:column}
  .signal-step-wrap{flex-direction:column}
  .signal-connector{width:auto;height:40px;transform:rotate(90deg)}
  .signal-step{min-width:200px}
}

/* ─── PRICING ─── */
.pricing { padding:120px 24px; max-width:900px; margin:0 auto; }
.pricing-table-wrap { opacity:0; transform:translateY(16px); transition:opacity .7s ease,transform .7s ease; }
.pricing-table-wrap.visible { opacity:1; transform:translateY(0); }
.pricing-table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.pricing-table { width:100%; border-collapse:collapse; min-width:560px; }
.pt-corner { background:transparent; }
.pt-head { font-weight:400; font-size:14px; color:#888; padding:20px 16px; text-align:center; border-bottom:1px solid #222; }
.pt-head.pt-noir { color:#fff; background:#151515; border-top:3px solid #4a9; border-radius:8px 8px 0 0; }
.pt-head.pt-noir span { display:block; }
.pt-head.pt-noir svg { display:inline-block; vertical-align:middle; margin-bottom:4px; }
.pt-badge { font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:#4a9; margin-top:4px; }
.pt-label { font-weight:300; font-size:13px; color:#888; padding:14px 16px; border-bottom:1px solid #151515; white-space:nowrap; }
.pt-val { text-align:center; padding:14px 16px; border-bottom:1px solid #151515; font-size:14px; }
.pt-noir-col { background:#111; }
.check.yes { color:#4a9; font-weight:600; }
.check.no { color:#444; }
.check.text { color:#888; font-family:'IBM Plex Mono',monospace; font-size:12px; }
.pricing-note { text-align:center; font-size:13px; color:#555; margin-top:32px; font-weight:300; }
@media(max-width:768px){ .pricing{padding:80px 16px} }

/* ─── EMAIL CTA ─── */
.email-cta { padding:100px 24px; background:#0e0e0e; }
.email-inner { max-width:500px; margin:0 auto; text-align:center; opacity:0; transform:translateY(16px); transition:opacity .7s ease,transform .7s ease; }
.email-inner.visible { opacity:1; transform:translateY(0); }
.email-inner h2 { font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-style:italic; font-size:clamp(28px,4vw,40px); margin-bottom:12px; }
.email-inner p { font-weight:300; font-size:15px; color:#888; margin-bottom:32px; }
.email-form { display:flex; gap:0; border-radius:4px; overflow:hidden; border:1px solid #222; }
.email-form input { flex:1; padding:14px 16px; background:#1a1a1a; color:#fff; border:none; font-family:'Outfit',sans-serif; font-size:14px; outline:none; }
.email-form input::placeholder { color:#555; }
.email-form input:focus { background:#1e1e1e; }
.email-form button { padding:14px 24px; background:#4a9; color:#000; border:none; font-family:'Outfit',sans-serif; font-weight:500; font-size:14px; cursor:pointer; transition:background .2s; letter-spacing:0.5px; }
.email-form button:hover { background:#5cb; }
.email-thanks { font-family:'IBM Plex Mono',monospace; font-size:14px; color:#4a9; padding:20px; animation:fadeUp .4s ease-out; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@media(max-width:768px){
  .email-cta{padding:60px 20px}
  .email-form{flex-direction:column}
  .email-form input{border-bottom:1px solid #222}
}

/* ─── FOOTER ─── */
.footer { padding:80px 24px 40px; border-top:1px solid #151515; }
.footer-grid { max-width:1100px; margin:0 auto; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:48px; }
.footer-brand p { font-weight:300; font-size:13px; color:#555; line-height:1.7; margin-top:12px; max-width:240px; }
.footer-logo { display:flex; align-items:center; gap:8px; font-weight:600; font-size:16px; letter-spacing:3px; }
.footer-col h4 { font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#888; margin-bottom:16px; }
.footer-col a { display:block; font-weight:300; font-size:13px; color:#555; padding:4px 0; transition:color .2s; }
.footer-col a:hover { color:#fff; }
.footer-bottom { max-width:1100px; margin:48px auto 0; padding-top:24px; border-top:1px solid #151515; display:flex; justify-content:space-between; font-size:12px; color:#444; font-weight:300; }
.footer-craft { font-style:italic; color:#555; }
@media(max-width:768px){
  .footer{padding:60px 20px 32px}
  .footer-grid{grid-template-columns:1fr 1fr;gap:32px}
  .footer-brand{grid-column:1/-1}
  .footer-bottom{flex-direction:column;gap:8px;text-align:center}
}
@media(max-width:480px){ .footer-grid{grid-template-columns:1fr} }
`;

// ═══════════════════════════════════════════════
// MAIN
// ═══════════════════════════════════════════════
function NoirLanding() {
  useFonts();
  return (
    <React.Fragment>
      <style>{styles}</style>
      <Nav />
      <Hero />
      <Features />
      <Quote />
      <Stats />
      <SignalPath />
      <Pricing />
      <EmailCTA />
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NoirLanding />);
  </script>
</body>
</html>
