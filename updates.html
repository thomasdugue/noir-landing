<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEAN — Updates</title>
  <meta name="description" content="Follow the development of HEAN, a bit-perfect lossless audio player for macOS built in Rust." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23000' width='100' height='100' rx='20'/><text y='70' x='15' font-size='60' fill='white' font-family='monospace'>H</text></svg>" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
const { useState, useEffect } = React;

function useFonts() {
  useEffect(() => {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Geist+Mono:wght@100;200;300;400;500;600&display=swap";
    document.head.appendChild(l);
    return () => document.head.removeChild(l);
  }, []);
}

function Logo({ size = 32, color = "#fff" }) {
  return (
    <svg width={size} height={size * 0.8} viewBox="0 0 100 80" fill={color}>
      <ellipse cx="12" cy="40" rx="8" ry="8" />
      <rect x="24" y="18" width="14" height="44" rx="7" />
      <rect x="43" y="4" width="14" height="72" rx="7" />
      <rect x="62" y="18" width="14" height="44" rx="7" />
      <ellipse cx="88" cy="40" rx="8" ry="8" />
      <ellipse cx="31" cy="40" rx="4" ry="5.5" fill="#000" />
      <ellipse cx="50" cy="40" rx="4" ry="5.5" fill="#000" />
      <ellipse cx="69" cy="40" rx="4" ry="5.5" fill="#000" />
    </svg>
  );
}

function Nav() {
  return (
    <nav className="nav nav--solid">
      <div className="nav__inner">
        <a className="nav__left" href="index.html">
          <Logo size={22} color="#fff" />
          <span className="nav__name">HEAN</span>
          <span className="nav__beta">BETA</span>
        </a>
        <div className="nav__links">
          <a href="index.html">Home</a>
          <a href="faq.html">FAQ</a>
          <a href="updates.html" className="nav__active">Updates</a>
          <a className="nav__cta" href="index.html#join">Join Beta</a>
        </div>
      </div>
    </nav>
  );
}

// ═══════════════════════════════════════════════
// UPDATES DATA — add new entries at the top
// ═══════════════════════════════════════════════
const updates = [
  {
    date: "2026-02-24",
    tag: "WEBSITE",
    title: "Landing page redesign",
    body: "New urgency banners, updated copy, removed DSD references, added FAQ page and changelog. SEO improvements with Schema.org and sitemap.",
  },
  {
    date: "2026-02-20",
    tag: "ENGINE",
    title: "Audio engine v0.9 — gapless playback",
    body: "Gapless playback now works across all supported formats. Zero gap between tracks for seamless album listening.",
  },
  {
    date: "2026-02-10",
    tag: "APP",
    title: "Beta build v0.8",
    body: "New library browser with folder view, improved metadata scanning, and faster startup on Apple Silicon.",
  },
  {
    date: "2026-01-28",
    tag: "BETA",
    title: "Beta program opened",
    body: "50 founding member spots now available. Email signup live on the landing page.",
  },
  {
    date: "2026-01-15",
    tag: "ENGINE",
    title: "CoreAudio Integer Mode validated",
    body: "Bit-perfect output confirmed with multiple USB DACs. Zero bits altered from file to DAC.",
  },
];

function UpdateItem({ date, tag, title, body }) {
  return (
    <div className="update">
      <div className="update__meta">
        <span className="update__date">{date}</span>
        <span className={`update__tag update__tag--${tag.toLowerCase()}`}>{tag}</span>
      </div>
      <h3 className="update__title">{title}</h3>
      <p className="update__body">{body}</p>
    </div>
  );
}

function Footer() {
  return (
    <footer className="foot">
      <div className="foot__inner">
        <div className="foot__left">
          <Logo size={18} color="#555" />
          <span>HEAN</span>
        </div>
        <div className="foot__right">
          <span>&copy; 2026 Hean Audio</span>
          <span className="foot__sep">&middot;</span>
          <a href="index.html">Home</a>
          <span className="foot__sep">&middot;</span>
          <a href="faq.html">FAQ</a>
          <span className="foot__sep">&middot;</span>
          <a href="updates.html">Updates</a>
        </div>
      </div>
    </footer>
  );
}

const css = `
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Geist Mono','Space Mono',monospace;
  background:#000;color:#fff;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  font-weight:300;letter-spacing:0.02em;
}
a{color:inherit;text-decoration:none;cursor:pointer}
::selection{background:#fff;color:#000}

.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #111}
.nav__inner{max-width:1200px;margin:0 auto;padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav__left{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.nav__name{font-size:14px;font-weight:400;letter-spacing:6px;color:#fff}
.nav__beta{font-size:8px;letter-spacing:2px;color:#000;background:#fff;padding:2px 6px;border-radius:2px;font-weight:600}
.nav__links{display:flex;align-items:center;gap:28px}
.nav__links a{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#666;transition:color .2s;font-weight:400}
.nav__links a:hover{color:#fff}
.nav__active{color:#fff!important}
.nav__cta{color:#fff!important;border:1px solid #333;padding:6px 16px!important;border-radius:2px;transition:all .2s!important}
.nav__cta:hover{background:#fff;color:#000!important;border-color:#fff}

.page-header{padding:140px 32px 60px;max-width:800px;margin:0 auto}
.page-header__label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#555;display:block;margin-bottom:12px}
.page-header__title{font-size:clamp(28px,4vw,42px);font-weight:200;letter-spacing:-1px;margin-bottom:16px}
.page-header__sub{font-size:14px;color:#666;font-weight:300;line-height:1.7;max-width:500px}

.updates{padding:0 32px 100px;max-width:800px;margin:0 auto}

.update{padding:32px 0;border-bottom:1px solid #111}
.update:first-child{border-top:1px solid #111}
.update__meta{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.update__date{font-size:11px;letter-spacing:1px;color:#555;font-weight:400}
.update__tag{font-size:8px;letter-spacing:2px;padding:2px 8px;border:1px solid #333;border-radius:2px;font-weight:400}
.update__tag--engine{color:#fff;border-color:#444}
.update__tag--app{color:#aaa;border-color:#333}
.update__tag--beta{color:#fff;border-color:#fff}
.update__tag--website{color:#888;border-color:#222}
.update__title{font-size:16px;font-weight:400;letter-spacing:0.5px;margin-bottom:8px}
.update__body{font-size:13px;line-height:1.8;color:#777;font-weight:300}

.foot{padding:40px 32px;border-top:1px solid #0a0a0a}
.foot__inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.foot__left{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:4px;color:#333}
.foot__right{display:flex;align-items:center;gap:0;font-size:10px;color:#444;letter-spacing:1px;font-weight:300}
.foot__right a{color:#555;transition:color .2s}
.foot__right a:hover{color:#fff}
.foot__sep{margin:0 12px;color:#111}

@media(max-width:768px){
  .nav__inner{padding:0 20px}
  .page-header{padding:100px 20px 40px}
  .updates{padding:0 20px 60px}
  .foot{padding:32px 20px}
  .foot__inner{flex-direction:column;gap:16px;text-align:center}
  .foot__right{flex-wrap:wrap;justify-content:center}
}
`;

function App() {
  useFonts();
  return (
    <React.Fragment>
      <style>{css}</style>
      <Nav />
      <div className="page-header">
        <span className="page-header__label">Changelog</span>
        <h1 className="page-header__title">Updates</h1>
        <p className="page-header__sub">
          Follow the development of Hean. New entries are added as we ship.
        </p>
      </div>
      <div className="updates">
        {updates.map((u, i) => <UpdateItem key={i} {...u} />)}
      </div>
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
